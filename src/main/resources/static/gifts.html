<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Gifts - Luminara</title><link rel='stylesheet' href='/css/styles.css'><script defer src='/js/app.js'></script></head>
<body><div class='layout'><aside class='sidebar'><div class='brand'>Luminara Connect ✨</div><nav class='nav'><a href='/index.html'>Dashboard</a><a href='/chats.html'>Chats</a><a href='/wallet.html'>Wallet</a><a class='active' href='/gifts.html'>Gifts</a></nav></aside>
<main class='content'><h1>Gift Gallery</h1><div class='grid two'>
<section class='card'><h3>Catalog</h3><div id='catalog' class='list'></div></section>
<section class='card'><h3>Send Gift</h3><label>From</label><select id='from' class='user-select'></select><label>To</label><select id='to' class='user-select'></select><label>Gift</label><select id='gift'></select><button id='sendGift'>Send Gift</button><small id='giftMsg'></small></section>
</div></main></div>
<script>
async function loadGifts(){const gifts=await api.get('/api/wallet/gifts');catalog.innerHTML=gifts.map(g=>`<div class='item'><b>${g.title}</b><br><small>${g.code}</small><div class='pill'>$${g.price}</div></div>`).join('');gift.innerHTML=gifts.map(g=>`<option value='${g.code}'>${g.title} - $${g.price}</option>`).join('');}
sendGift.onclick=async()=>{try{await api.post('/api/wallet/gifts/send',{fromUserId:from.value,toUserId:to.value,giftCode:gift.value});showMsg('giftMsg','Gift sent 🎁');}catch(e){showMsg('giftMsg',e.message,true)}};
refreshUsers();loadGifts();
</script></body></html>
