<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Luminara Connect</title><link rel='stylesheet' href='/css/styles.css'><script defer src='/js/app.js'></script></head>
<body><div class='layout'>
<aside class='sidebar'><div class='brand'>Luminara Connect ✨</div><nav class='nav'><a href='/auth.html'>Sign In / Sign Up</a><a class='active' href='/index.html'>Dashboard</a><a href='/chats.html'>Chats</a><a href='/wallet.html'>Wallet</a><a href='/gifts.html'>Gifts</a><a href='javascript:void(0)' onclick='logout()'>Logout</a></nav></aside>
<main class='content'>
<div class='hero'><div><h1>Beyond messaging, built for meaningful exchange.</h1><small>A beautiful Java-powered social wallet messenger.</small></div><span class='pill'>Design: Aurora Glass</span></div>
<div class='grid two' style='margin-top:16px'>
<section class='card'><h3>Create User</h3><label>Name</label><input id='name'><label>Phone</label><input id='phone'><button id='create'>Create</button><small id='createMsg'></small></section>
<section class='card'><h3>People</h3><div id='people' class='list'></div></section>
</div></main></div>
<script>
requireAuth();
async function loadPeople(){const users=await api.get('/api/users');document.getElementById('people').innerHTML=users.map(u=>`<div class='item'><b>${u.displayName}</b><br><small>${u.phoneNumber}</small><div class='stat'>Wallet: $${u.walletBalance}</div></div>`).join('')||'<small>No users yet.</small>';} 
document.getElementById('create').onclick=async()=>{try{await api.post('/api/users',{displayName:name.value,phoneNumber:phone.value});showMsg('createMsg','User created');name.value='';phone.value='';loadPeople();}catch(e){showMsg('createMsg',e.message,true)}};
loadPeople();
</script></body></html>
