<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sign in - Luminara</title><link rel='stylesheet' href='/css/styles.css'><script defer src='/js/app.js'></script></head>
<body><div class='layout'>
<aside class='sidebar'><div class='brand'>Luminara Connect ✨</div><nav class='nav'><a class='active' href='/auth.html'>Sign In / Sign Up</a><a href='/index.html'>Dashboard</a><a href='/chats.html'>Chats</a><a href='/wallet.html'>Wallet</a><a href='/gifts.html'>Gifts</a></nav></aside>
<main class='content'>
<div class='hero'><div><h1>Secure mobile number login</h1><small>Create account or sign in using your phone number.</small></div><span class='pill'>OTP Login</span></div>
<div class='grid two' style='margin-top:16px'>
<section class='card'><h3>Step 1: Request Code</h3><label>Mobile Number</label><input id='phone' placeholder='+1234567890'><label>Display Name (required for new users)</label><input id='displayName' placeholder='Only first sign-up'><button id='requestBtn'>Request Code</button><small id='requestMsg'></small><div id='demoCode' class='stat' style='margin-top:10px;display:none'></div></section>
<section class='card'><h3>Step 2: Verify & Enter</h3><label>Mobile Number</label><input id='verifyPhone' placeholder='+1234567890'><label>6-digit Code</label><input id='code'><button class='secondary' id='verifyBtn'>Verify & Login</button><small id='verifyMsg'></small></section>
</div>
</main></div>
<script>
requestBtn.onclick=async()=>{try{const r=await api.post('/api/auth/request-code',{phoneNumber:phone.value,displayName:displayName.value});showMsg('requestMsg',r.message);demoCode.style.display='block';demoCode.textContent='Demo code: '+r.demoCode;}catch(e){showMsg('requestMsg',e.message,true)}};
verifyBtn.onclick=async()=>{try{const r=await api.post('/api/auth/verify-code',{phoneNumber:verifyPhone.value,code:code.value});store.token=r.token;store.currentUser=r.userId;showMsg('verifyMsg','Logged in successfully');setTimeout(()=>window.location.href='/index.html',400);}catch(e){showMsg('verifyMsg',e.message,true)}};
</script></body></html>
